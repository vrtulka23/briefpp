name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: C++ tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DREPORTLIB_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run doctest suite
        run: ctest --test-dir build --output-on-failure

  docs:
    name: Sphinx website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Sphinx
        run: python -m pip install -r docs/requirements.txt
      - name: Build HTML website
        run: sphinx-build -b html -W --keep-going docs build/site
      - name: Upload website
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-site
          path: build/site/
          if-no-files-found: error
