name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          cmake = Path("CMakeLists.txt").read_text()
          match = re.search(r"project\(briefpp VERSION ([^\s)]+)", cmake)
          if not match or match.group(1) != version:
              raise SystemExit("CMake and Python package versions must match")
          release_ref = os.environ["RELEASE_REF"]
          if release_ref.startswith("refs/tags/") and release_ref.removeprefix("refs/tags/") != f"v{version}":
              raise SystemExit(f"Release ref {release_ref!r} must match package version v{version}")
          PY
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify Python binding and installed headers
        run: |
          python -m pip install --no-deps dist/*.whl
          python tests/test_python.py
          python - <<'PY'
          from pathlib import Path
          import briefpp

          include = Path(briefpp.get_include())
          assert (include / "briefpp" / "report.hpp").is_file()
          assert (include / "briefpp" / "renderers" / "latex.hpp").is_file()
          print(f"Installed headers: {include}")
          PY
          briefpp_include=$(python -c 'import briefpp; print(briefpp.get_include())')
          c++ -std=c++17 -I "$briefpp_include" -x c++ -fsyntax-only - <<'CPP'
          #include <briefpp/report.hpp>
          int main() {
              briefpp::Document doc;
              doc.title("PyPI headers");
              return 0;
          }
          CPP
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: windows-2025
            arch: AMD64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    env:
      CIBW_ARCHS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install cibuildwheel
        run: python -m pip install 'cibuildwheel>=3,<4'
      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist/
          merge-multiple: true
      - name: Publish release
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
