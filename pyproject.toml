[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "briefpp"
version = "0.2.1"
description = "Brief++: C++17 reports with Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Brief++ contributors" }]
keywords = ["c++", "header-only", "reports", "latex", "html"]

[project.urls]
Homepage = "https://github.com/vrtulka23/briefpp"
Documentation = "https://vrtulka23.github.io/briefpp/"
Source = "https://github.com/vrtulka23/briefpp"

[tool.scikit-build]
wheel.packages = ["python/briefpp"]
sdist.include = ["CMakeLists.txt", "include/briefpp/**", "python/**", "tests/test_python.py", "README.md", "LICENSE", "pyproject.toml"]

[tool.scikit-build.cmake.define]
BRIEFPP_BUILD_PYTHON = "ON"
BRIEFPP_BUILD_TESTS = "OFF"
BRIEFPP_BUILD_EXAMPLES = "OFF"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
test-command = "python {project}/tests/test_python.py"
